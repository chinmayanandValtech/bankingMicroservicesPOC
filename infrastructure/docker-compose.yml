version: "3.9"

name: bankingmicroservices

services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    networks:
      - banking-network

    environment:
      POSTGRES_USER: chinmayanand
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinmayanand"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - banking-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped

    ports:
      - "8088:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: Banking Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - banking-network

  service-registry:
    build:
      context: ../services/service-registry

    container_name: service-registry

    ports:
      - "8761:8761"
    networks:
      - banking-network
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: ../services/config-server

    container_name: config-server

    ports:
      - "8888:8888"
    networks:
      - banking-network
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      EUREKA_URL: http://service-registry:8761/eureka

    depends_on:
      service-registry:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ../services/api-gateway

    container_name: api-gateway
    networks:
      - banking-network
    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  account-service:
    build:
      context: ../services/account-service

    container_name: account-service
    networks:
      - banking-network
    ports:
      - "8082:8082"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  customer-service:
    build:
      context: ../services/customer-service

    container_name: customer-service
    networks:
      - banking-network
    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  transaction-service:
    build:
      context: ../services/transaction-service

    container_name: transaction-service
    networks:
      - banking-network
    ports:
      - "8083:8083"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    build:
      context: ../services/auth-service

    container_name: auth-service
    networks:
      - banking-network
    ports:
      - "8084:8084"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  banking-network:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:


