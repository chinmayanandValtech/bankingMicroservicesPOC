spring.datasource.url=jdbc:postgresql://postgres:5432/transaction_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

account-service.url=http://account-service:8082

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

resilience4j.retry.instances.accountService.max-attempts=3
resilience4j.retry.instances.accountService.wait-duration=500ms
resilience4j.retry.instances.accountService.ignore-exceptions[0]=com.bank.transaction_service.exception.ResourceNotFoundException
resilience4j.retry.instances.accountService.ignore-exceptions[1]=com.bank.transaction_service.exception.ForbiddenException

resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.accountService.ignore-exceptions[0]=com.bank.transaction_service.exception.ResourceNotFoundException
resilience4j.circuitbreaker.instances.accountService.ignore-exceptions[1]=com.bank.transaction_service.exception.ForbiddenException

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/banking

internal.call.secret=${INTERNAL_CALL_SECRET:local-dev-internal-secret}

# Keycloak runs on the host, not in the cluster. Fetch keys via the host alias,
# but validate the issuer claim as localhost:8180 (what tokens are actually
# issued with). Same approach as the docker profile.
keycloak.jwk-set-uri=http://host.docker.internal:8180/realms/banking/protocol/openid-connect/certs
keycloak.issuer=http://localhost:8180/realms/banking

# Register by pod IP. Pod hostnames are not DNS-resolvable, so the gateway
# gets UnknownHostException when Eureka hands it a hostname.
eureka.instance.prefer-ip-address=true
