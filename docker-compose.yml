version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always

    environment:
      POSTGRES_USER: chinmayanand
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinmayanand"]
      interval: 5s
      timeout: 5s
      retries: 10

  service-registry:
    build:
      context: ./service-registry

    container_name: service-registry

    ports:
      - "8761:8761"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: ./config-server

    container_name: config-server

    ports:
      - "8888:8888"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      EUREKA_URL: http://service-registry:8761/eureka

    depends_on:
      service-registry:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway

    container_name: api-gateway

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  account-service:
    build:
      context: ./account-service

    container_name: account-service

    ports:
      - "8082:8082"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  customer-service:
    build:
      context: ./customer-service

    container_name: customer-service

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  transaction-service:
    build:
      context: ./transaction-service

    container_name: transaction-service

    ports:
      - "8083:8083"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data: