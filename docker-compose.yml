version: "3.9"

services:

  postgres:
    image: postgres:17

    container_name: postgres

    restart: always

    environment:
      POSTGRES_USER: chinmayanand
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinmayanand"]
      interval: 5s
      timeout: 5s
      retries: 10

  service-registry:
    build:
      context: ./service-registry

    container_name: service-registry

    ports:
      - "8761:8761"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      service-registry:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8888'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway

    container_name: api-gateway

    ports:
      - "8080:8080"

    environment:
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  account-service:
    build:
      context: ./account-service

    container_name: account-service

    ports:
      - "8082:8082"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/account_db
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  customer-service:
    build:
      context: ./customer-service

    container_name: customer-service

    ports:
      - "8081:8081"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy


  transaction-service:
    build:
      context: ./transaction-service

    container_name: transaction-service

    ports:
      - "8083:8083"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transaction_db
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy


volumes:
  postgres-data: