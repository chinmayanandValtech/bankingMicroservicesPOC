version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: sneha.satish
      POSTGRES_PASSWORD: Valtech@2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneha.satish"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: always

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

  config-server:
    build:
      context: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  service-registry:
    build:
      context: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"

    depends_on:
      config-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-service
    ports:
      - "8081:8081"

    depends_on:
      config-server:
        condition: service_healthy

      service-registry:
        condition: service_healthy

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  account-service:
    build:
      context: ./account-service
    container_name: account-service
    ports:
      - "8082:8082"

    environment:
      SPRING_PROFILES_ACTIVE: dev

    depends_on:
      config-server:
        condition: service_healthy

      service-registry:
        condition: service_healthy

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  transaction-service:
    build:
      context: ./transaction-service
    container_name: transaction-service
    ports:
      - "8083:8083"

    depends_on:
      config-server:
        condition: service_healthy

      service-registry:
        condition: service_healthy

      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

      redis:
        condition: service_healthy

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "8084:8084"

    depends_on:
      config-server:
        condition: service_healthy

      service-registry:
        condition: service_healthy

      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"

    depends_on:
      customer-service:
        condition: service_started

      account-service:
        condition: service_started

      transaction-service:
        condition: service_started

      auth-service:
        condition: service_started

      service-registry:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service

    ports:
      - "8085:8085"

    depends_on:
      kafka:
        condition: service_started

      service-registry:
        condition: service_healthy

      config-server:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres-data:
  redis-data: