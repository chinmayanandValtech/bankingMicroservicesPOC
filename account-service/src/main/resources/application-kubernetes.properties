spring.datasource.url=jdbc:postgresql://postgres:5432/account_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

customer-service.url=http://customer-service:8081

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/banking

keycloak.url=http://host.docker.internal:8180
keycloak.realm=banking
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

transaction-service.url=http://transaction-service:8083

internal.call.secret=${INTERNAL_CALL_SECRET:local-dev-internal-secret}

# Keycloak runs on the host, not in the cluster. Fetch keys via the host alias,
# but validate the issuer claim as localhost:8180 (what tokens are actually
# issued with). Same approach as the docker profile.
keycloak.jwk-set-uri=http://host.docker.internal:8180/realms/banking/protocol/openid-connect/certs
keycloak.issuer=http://localhost:8180/realms/banking

# Register by pod IP. Pod hostnames are not DNS-resolvable, so the gateway
# gets UnknownHostException when Eureka hands it a hostname.
eureka.instance.prefer-ip-address=true
