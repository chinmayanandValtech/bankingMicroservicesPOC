apiVersion: apps/v1
kind: Deployment

metadata:
  name: account-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: account-service

  template:
    metadata:
      labels:
        app: account-service

    spec:
      containers:
        - name: account-service

          image: chinmayanand5613/account-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082