spring.datasource.url=jdbc:postgresql://postgres:5432/customer_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
# Pods register by IP; the pod hostname is not resolvable by other services,
# which is what caused the gateway's UnknownHostException.
eureka.instance.prefer-ip-address=true


keycloak.url=${KEYCLOAK_URL:http://host.docker.internal:8180}
keycloak.realm=banking
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# Keycloak runs on the host, not in the cluster. Fetch keys via the host alias,
# but validate the issuer claim as localhost:8180 (what tokens are actually
# issued with). Same approach as the docker profile.
keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://host.docker.internal:8180/realms/banking/protocol/openid-connect/certs}
keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/realms/banking}
