spring.application.name=financial-intelligence-service

server.port=8084

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# Alias that tracks the current Flash model. Pinned versions (2.5-flash,
# 2.5-flash-lite) are already blocked for new API keys, so a fixed version
# will silently stop working again later.
spring.ai.google.genai.chat.options.model=gemini-flash-latest


transaction-service.url=http://localhost:8083