# Application Name
spring.application.name=api-gateway

# Server Port
server.port=8080

# ==========================
# Config Server
# ==========================

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# ==========================
# Eureka Configuration
# ==========================

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

# ==========================
# Gateway Discovery Locator
# ==========================

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# ==========================
# Customer Service Route
# ==========================

spring.cloud.gateway.server.webflux.routes[0].id=customer-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/customers/**

# ==========================
# Account Service Route
# ==========================

spring.cloud.gateway.server.webflux.routes[1].id=account-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/accounts/**

# ==========================
# Transaction Service Route
# ==========================

spring.cloud.gateway.server.webflux.routes[2].id=transaction-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/transactions/**

# ==========================
# Auth Service Route
# ==========================

spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth/**

# ==========================
# JWT Configuration
# ==========================

jwt.secret=ThisIsMySecretKeyForJwtAuthenticationInBankingApplication9844442726
jwt.expiration=3600000

# ==========================
# Actuator
# ==========================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ==========================
# Logging
# ==========================

logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.web=INFO
# ==========================
# Eureka Instance Config
# ==========================

eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=Customer Service
springdoc.swagger-ui.urls[0].url=/customer-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Account Service
springdoc.swagger-ui.urls[1].url=/account-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Transaction Service
springdoc.swagger-ui.urls[2].url=/transaction-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=Auth Service
springdoc.swagger-ui.urls[3].url=/auth-service/v3/api-docs
