server.port=9090

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# Keycloak runs standalone on the host, not in this compose stack.
# Tokens are issued with iss=http://localhost:8180/realms/banking (since that's
# the hostname clients like Postman use), but this container must reach Keycloak
# via Docker's host.docker.internal alias, not "localhost" (which inside a
# container refers to the container itself). See SecurityConfig's docker-profile
# JwtDecoder bean, which fetches keys from host.docker.internal but still
# validates the issuer claim against localhost:8180 to match real tokens.
keycloak.jwk-set-uri=http://host.docker.internal:8180/realms/banking/protocol/openid-connect/certs
keycloak.issuer=http://localhost:8180/realms/banking
