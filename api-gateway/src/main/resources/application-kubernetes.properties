spring.application.name=api-gateway
server.port=9090

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Fetch signing keys over the EC2 PRIVATE IP - reachable from inside the pod.

# Validate "iss" against the PUBLIC IP - that is what Keycloak stamps into tokens
# handed to Postman. Must match the token's iss exactly (scheme, host, port, no
# trailing slash). Update this if the EC2 public IP changes.
keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://172.31.0.85:8180/realms/banking/protocol/openid-connect/certs}
keycloak.issuer=${KEYCLOAK_ISSUER:http://13.207.215.97:8180/realms/banking}

spring.cloud.gateway.server.webmvc.routes[0].id=customer-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/customers/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RemoveRequestHeader=X-Internal-Call

spring.cloud.gateway.server.webmvc.routes[1].id=account-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ACCOUNT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/accounts/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=RemoveRequestHeader=X-Internal-Call

spring.cloud.gateway.server.webmvc.routes[2].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://TRANSACTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/transactions/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=RemoveRequestHeader=X-Internal-Call

spring.cloud.gateway.server.webmvc.routes[3].id=financial-intelligence-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://FINANCIAL-INTELLIGENCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/ai/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=RemoveRequestHeader=X-Internal-Call

management.endpoints.web.exposure.include=*