name: Customer Service CI/CD

on:
  push:
    branches:
      - chinmay_prod
    paths:
      - 'services/customer-service/**'
      - '.github/workflows/customer-service.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build Customer Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/customer-service

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: customer-service-jar
          path: services/customer-service/target/*.jar
          retention-days: 7

  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.TAG }}

    defaults:
      run:
        working-directory: services/customer-service

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: customer-service-jar
          path: services/customer-service/target

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Image Tag
        id: tag
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/customer-service:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/customer-service:${{ steps.tag.outputs.TAG }} \
            .

      - name: Push Latest
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/customer-service:latest

      - name: Push SHA Tag
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/customer-service:${{ steps.tag.outputs.TAG }}

  gitops:
    name: Update GitOps Repository
    needs: docker
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Banking-Kubernetes
        uses: actions/checkout@v4
        with:
          repository: chinmayanandValtech/Banking-Kubernetes
          token: ${{ secrets.GH_PAT }}
          path: banking-kubernetes

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update Deployment Image
        run: |
          yq -i '
          .spec.template.spec.containers[0].image =
          "${{ secrets.DOCKERHUB_USERNAME }}/customer-service:${{ needs.docker.outputs.image_tag }}"
          ' banking-kubernetes/customer-service/deployment.yaml 

      - name: Configure Git
        run: |
          cd banking-kubernetes

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit Changes
        run: |
          cd banking-kubernetes

          git add .

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Deploy customer-service:${{ needs.docker.outputs.image_tag }}"

          git push