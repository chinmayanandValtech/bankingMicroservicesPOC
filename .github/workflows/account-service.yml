name: Account Service CI

on:
  push:
    branches:
      - chinmay_prod
    paths:
      - 'services/account-service/**'
      - '.github/workflows/account-service.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Account Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/account-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: account-service-jar
          path: services/account-service/target/*.jar
          retention-days: 7

  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/account-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: account-service-jar
          path: services/account-service/target

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Tag
        id: vars
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/account-service:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/account-service:${{ steps.vars.outputs.TAG }} \
            .

      - name: Push Latest Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/account-service:latest

      - name: Push Version Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/account-service:${{ steps.vars.outputs.TAG }}