name: Account Service CI

on:
  push:
    branches:
      - chinmay_prod
    paths:
      - 'services/account-service/**'
      - '.github/workflows/account-service.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/account-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Verify Java
        run: |
          java -version
          mvn -version

      - name: Verify Docker
        run: docker --version

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/account-service:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/account-service:${{ github.sha }} \
            .
      - name: List Docker Images
        run: docker images

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Latest Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/account-service:latest

      - name: Push Commit Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/account-service:${{ github.sha }}