name: Banking Microservices CI

on:
  push:
    branches:
      - saniya-dev-newAdditionsFinal
  pull_request:
    branches:
      - saniya-dev-newAdditionsFinal

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - account-service
          - api-gateway
          - customer-service
          - eureka-server
          - financial-intelligence-service
          - transaction-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SANIYA_DOCKERHUB_USERNAME }}
          password: ${{ secrets.SANIYA_DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ./${{ matrix.service }}
        run: |
          docker build \
            -t ${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }} \
            -t ${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

          docker push \
            ${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  deploy:
    name: Deploy to AWS Kubernetes
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SANIYA_EC2_HOST }}
          username: ${{ secrets.SANIYA_EC2_USERNAME }}
          key: ${{ secrets.SANIYA_EC2_SSH_KEY }}
          script: |
            set -e
            echo "Updating Kubernetes deployments..."

            sudo kubectl -n banking set image deployment/account-service \
              account-service=${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/account-service:${{ github.sha }}

            sudo kubectl -n banking set image deployment/api-gateway \
              api-gateway=${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }}

            sudo kubectl -n banking set image deployment/customer-service \
              customer-service=${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/customer-service:${{ github.sha }}

            sudo kubectl -n banking set image deployment/eureka-server \
              eureka-server=${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/eureka-server:${{ github.sha }}

            sudo kubectl -n banking set image deployment/financial-intelligence-service \
              financial-intelligence-service=${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/financial-intelligence-service:${{ github.sha }}

            sudo kubectl -n banking set image deployment/transaction-service \
              transaction-service=${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/transaction-service:${{ github.sha }}

            echo "Waiting for deployments..."

            sudo kubectl -n banking rollout status deployment/account-service --timeout=180s
            sudo kubectl -n banking rollout status deployment/api-gateway --timeout=180s
            sudo kubectl -n banking rollout status deployment/customer-service --timeout=180s
            sudo kubectl -n banking rollout status deployment/eureka-server --timeout=180s
            sudo kubectl -n banking rollout status deployment/financial-intelligence-service --timeout=180s
            sudo kubectl -n banking rollout status deployment/transaction-service --timeout=180s

            echo "Deployment completed successfully."

            sudo kubectl get pods -n banking