name: Banking Microservices CI

on:
  push:
    branches:
      - saniya-dev-newAdditionsFinal
  pull_request:
    branches:
      - saniya-dev-newAdditionsFinal

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - account-service
          - api-gateway
          - customer-service
          - eureka-server
          - financial-intelligence-service
          - transaction-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SANIYA_DOCKERHUB_USERNAME }}
          password: ${{ secrets.SANIYA_DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ./${{ matrix.service }}
        run: |
          docker build \
            -t ${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.SANIYA_DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest